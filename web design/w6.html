<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Faculty of Economics </title>     
  </head>

  <body>
    <h1> Email List Signup Form </h1>
    <fieldset> 
    <legend> Sign up to our email list</legend>
    <p> Stay informed about news!</p>      
      <form> 
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
            
        <label>Department:</label><br>
            
        <input type="checkbox" id="YBS" name="department" Value="YBS" checked>
        <label for="YBS">YBS</label><br>
            
        <input type="checkbox" id="Econometry" name="department" Value="Econometry">
        <label for="Econometry">Econometry</label><br>

        <label for="colour">Theme colour:</label><br>
        <select id="colour" name="colour" size="2" multiple>
          <option value="python">white</option>
          <option value="python">black</option>
           
        <button type="submit">Submit</button>        
      </form>
    </fieldset> 
  </body>
</html>
